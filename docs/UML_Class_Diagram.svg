<svg viewBox="0 0 1100 880" width="100%" xmlns="http://www.w3.org/2000/svg"
     style="font-family: 'Segoe UI', Arial, sans-serif; background:#ffffff; border:1px solid #000000;">
  <defs>
    <marker id="hollowTri" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M 1 1 L 13 7 L 1 13 z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#000000" stroke-width="1.6"/>
    </marker>
    <marker id="compDiamond" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="13" markerHeight="9" orient="auto">
      <path d="M 1 5 L 8 1 L 15 5 L 8 9 z" fill="#000000" stroke="#000000" stroke-width="1.2"/>
    </marker>
    <marker id="aggDiamond" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="13" markerHeight="9" orient="auto">
      <path d="M 1 5 L 8 1 L 15 5 L 8 9 z" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- Row 1: Identifiable Interface & DataManager Generic -->
  <g transform="translate(220,20)">
    <rect width="230" height="82" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="36" x2="230" y2="36" stroke="#000000"/>
    <text x="115" y="15" font-size="10.5" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text x="115" y="30" font-size="13" font-weight="bold" text-anchor="middle">Identifiable</text>
    <text x="10" y="53" font-size="11">+ getId() : String</text>
    <text x="10" y="70" font-size="11">+ getSummary() : String</text>
  </g>

  <g transform="translate(760,20)">
    <rect width="305" height="148" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="36" x2="305" y2="36" stroke="#000000"/>
    <line x1="0" y1="74" x2="305" y2="74" stroke="#000000"/>
    <text x="152" y="15" font-size="10.5" text-anchor="middle">&lt;&lt;generic class&gt;&gt;</text>
    <text x="152" y="30" font-size="12.5" font-weight="bold" text-anchor="middle">DataManager&lt;T extends Identifiable&gt;</text>
    <text x="10" y="52" font-size="11">- list : ArrayList&lt;T&gt;</text>
    <text x="10" y="67" font-size="11">- map : HashMap&lt;String, T&gt;</text>
    <text x="10" y="91" font-size="11">+ add(item : T) : void</text>
    <text x="10" y="106" font-size="11">+ findById(id : String) : T</text>
    <text x="10" y="121" font-size="11">+ remove(id : String) : void</text>
    <text x="10" y="136" font-size="11">+ getAll() : ArrayList&lt;T&gt;</text>
  </g>

  <!-- Row 2: Abstract Person & WorkoutLog -->
  <g transform="translate(110,150)">
    <rect width="305" height="165" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
    <line x1="0" y1="36" x2="305" y2="36" stroke="#000000"/>
    <line x1="0" y1="100" x2="305" y2="100" stroke="#000000"/>
    <text x="152" y="15" font-size="10.5" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
    <text x="152" y="30" font-size="13.5" font-weight="bold" font-style="italic" text-anchor="middle">Person</text>
    <text x="10" y="52" font-size="11">- id : String</text>
    <text x="10" y="66" font-size="11">- name : String</text>
    <text x="10" y="80" font-size="11">- phone : String</text>
    <text x="10" y="94" font-size="11">- email : String</text>
    <text x="10" y="117" font-size="11" font-style="italic">+ getRole() : String {abstract}</text>
    <text x="10" y="133" font-size="11" font-style="italic">+ calculateMonthlyAmount() : double</text>
    <text x="10" y="149" font-size="11">+ getSummary() : String</text>
  </g>

  <g transform="translate(465,165)">
    <rect width="265" height="175" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="28" x2="265" y2="28" stroke="#000000"/>
    <line x1="0" y1="104" x2="265" y2="104" stroke="#000000"/>
    <text x="132" y="19" font-size="13" font-weight="bold" text-anchor="middle">WorkoutLog</text>
    <text x="10" y="44" font-size="10.5">- logId, memberId, date : String</text>
    <text x="10" y="59" font-size="10.5">- exerciseName, type : String</text>
    <text x="10" y="74" font-size="10.5">- sets, reps, durationMinutes : int</text>
    <text x="10" y="89" font-size="10.5">- weightKg : double | - caloriesBurned : int</text>
    <text x="10" y="121" font-size="10.5">+ WorkoutLog(...Strength...) [Overloaded]</text>
    <text x="10" y="136" font-size="10.5">+ WorkoutLog(...Cardio...) [Overloaded]</text>
    <text x="10" y="151" font-size="10.5">+ getTotalVolume() : double</text>
    <text x="10" y="166" font-size="10.5">+ toFileLine() : String</text>
  </g>

  <!-- Row 3: Member, Trainer, FileHandler -->
  <g transform="translate(25,385)">
    <rect width="335" height="218" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
    <line x1="0" y1="28" x2="335" y2="28" stroke="#000000"/>
    <line x1="0" y1="104" x2="335" y2="104" stroke="#000000"/>
    <text x="167" y="19" font-size="13.5" font-weight="bold" text-anchor="middle">Member</text>
    <text x="10" y="44" font-size="11">- plan : String</text>
    <text x="10" y="59" font-size="11">- weightKg : double | - heightCm : double</text>
    <text x="10" y="74" font-size="11">- assignedTrainer : Trainer</text>
    <text x="10" y="89" font-size="11">- workouts : ArrayList&lt;WorkoutLog&gt;</text>
    <text x="10" y="120" font-size="10.5">+ calculateBMI() : double</text>
    <text x="10" y="135" font-size="10.5">+ addWorkout(log : WorkoutLog) : void</text>
    <text x="10" y="150" font-size="10.5">+ addWorkout(..., sets, reps, kg) : WorkoutLog</text>
    <text x="10" y="165" font-size="10.5">+ addWorkout(..., mins, kcal) : WorkoutLog</text>
    <text x="10" y="180" font-size="10.5">+ getRole() : String</text>
    <text x="10" y="195" font-size="10.5">+ calculateMonthlyAmount() : double</text>
    <text x="10" y="210" font-size="10.5">+ toFileLine() : String</text>
  </g>

  <g transform="translate(415,400)">
    <rect width="295" height="190" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
    <line x1="0" y1="28" x2="295" y2="28" stroke="#000000"/>
    <line x1="0" y1="98" x2="295" y2="98" stroke="#000000"/>
    <text x="147" y="19" font-size="13.5" font-weight="bold" text-anchor="middle">Trainer</text>
    <text x="10" y="44" font-size="11">- specialty : String</text>
    <text x="10" y="59" font-size="11">- baseSalary : double</text>
    <text x="10" y="74" font-size="11">- experienceYears : int</text>
    <text x="10" y="89" font-size="11">- assignedMembers : ArrayList&lt;Member&gt;</text>
    <text x="10" y="116" font-size="10.5">+ addAssignedMember(m : Member) : void</text>
    <text x="10" y="132" font-size="10.5">+ getRole() : String</text>
    <text x="10" y="148" font-size="10.5">+ calculateMonthlyAmount() : double</text>
    <text x="10" y="164" font-size="10.5">+ getSummary() : String</text>
    <text x="10" y="180" font-size="10.5">+ toFileLine() : String</text>
  </g>

  <g transform="translate(765,245)">
    <rect width="300" height="145" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="28" x2="300" y2="28" stroke="#000000"/>
    <line x1="0" y1="88" x2="300" y2="88" stroke="#000000"/>
    <text x="150" y="19" font-size="13" font-weight="bold" text-anchor="middle">FileHandler</text>
    <text x="10" y="45" font-size="10.5">- dataFolder : File</text>
    <text x="10" y="61" font-size="10.5">- membersFile, trainersFile : File</text>
    <text x="10" y="77" font-size="10.5">- workoutsFile : File</text>
    <text x="10" y="106" font-size="10.5">+ saveAll(trainers, members, workouts) : void</text>
    <text x="10" y="124" font-size="10.5">+ loadAll(trainers, members, workouts) : void</text>
  </g>

  <!-- Row 4: Exceptions & GymGUI -->
  <g transform="translate(25,650)">
    <rect width="450" height="168" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
    <text x="12" y="18" font-size="11.5" font-weight="bold">Custom Exceptions (extends java.lang.Exception)</text>
    <line x1="0" y1="26" x2="450" y2="26" stroke="#000000"/>

    <rect x="140" y="38" width="170" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <text x="225" y="58" font-size="12" font-weight="bold" text-anchor="middle">java.lang.Exception</text>

    <rect x="16" y="102" width="130" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <text x="81" y="121" font-size="9.5" text-anchor="middle">&lt;&lt;exception&gt;&gt;</text>
    <text x="81" y="139" font-size="10.5" font-weight="bold" text-anchor="middle">DuplicateIdException</text>

    <rect x="160" y="102" width="130" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <text x="225" y="121" font-size="9.5" text-anchor="middle">&lt;&lt;exception&gt;&gt;</text>
    <text x="225" y="139" font-size="10.5" font-weight="bold" text-anchor="middle">NotFoundException</text>

    <rect x="304" y="102" width="130" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <text x="369" y="121" font-size="9.5" text-anchor="middle">&lt;&lt;exception&gt;&gt;</text>
    <text x="369" y="139" font-size="10.5" font-weight="bold" text-anchor="middle">InvalidDataException</text>

    <path d="M 81 102 L 81 84 L 369 84 L 369 102" fill="none" stroke="#000000" stroke-width="1.3"/>
    <line x1="225" y1="102" x2="225" y2="69" stroke="#000000" stroke-width="1.4" marker-end="url(#hollowTri)"/>
  </g>

  <g transform="translate(560,645)">
    <rect width="505" height="173" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="36" x2="505" y2="36" stroke="#000000"/>
    <line x1="0" y1="104" x2="505" y2="104" stroke="#000000"/>
    <text x="252" y="15" font-size="10.5" text-anchor="middle">&lt;&lt;extends JFrame&gt;&gt;</text>
    <text x="252" y="30" font-size="13" font-weight="bold" text-anchor="middle">GymGUI (Swing Interface)</text>
    <text x="10" y="53" font-size="10.5">- memberManager : DataManager&lt;Member&gt;</text>
    <text x="10" y="69" font-size="10.5">- trainerManager : DataManager&lt;Trainer&gt;</text>
    <text x="10" y="85" font-size="10.5">- workoutManager : DataManager&lt;WorkoutLog&gt;   |   - fileHandler : FileHandler</text>
    <text x="10" y="122" font-size="10.5">+ createMembersTab() / createTrainersTab() / createWorkoutsTab() / createSummaryTab()</text>
    <text x="10" y="139" font-size="10.5">+ addMemberAction() / addTrainerAction() / logWorkoutAction()</text>
    <text x="10" y="156" font-size="10.5">+ refreshAllTables() / refreshSummaryTab()</text>
  </g>

  <!-- ==================== CLEAN CONNECTORS ==================== -->
  <!-- Person implements Identifiable -->
  <path d="M 285 150 L 285 104" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#hollowTri)"/>
  <!-- WorkoutLog implements Identifiable -->
  <path d="M 550 165 L 550 124 L 380 124 L 380 104" fill="none" stroke="#000000" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#hollowTri)"/>

  <!-- Member and Trainer extend Person -->
  <path d="M 190 385 L 190 345 L 245 345 L 245 317" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#hollowTri)"/>
  <path d="M 510 400 L 510 365 L 305 365 L 305 317" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#hollowTri)"/>

  <!-- Member owns WorkoutLog (Composition) -->
  <path d="M 360 425 L 392 425 L 392 355 L 595 355 L 595 342" fill="none" stroke="#000000" stroke-width="1.5" marker-start="url(#compDiamond)" marker-end="url(#openArrow)"/>
  <text x="370" y="418" font-size="10">1</text>
  <text x="603" y="352" font-size="10">0..* logs</text>

  <!-- Member references Trainer (Aggregation) -->
  <line x1="360" y1="498" x2="413" y2="498" stroke="#000000" stroke-width="1.5" marker-start="url(#aggDiamond)" marker-end="url(#openArrow)"/>
  <text x="368" y="491" font-size="10">0..*</text>
  <text x="392" y="514" font-size="10">0..1</text>

  <!-- GymGUI uses FileHandler -->
  <line x1="915" y1="645" x2="915" y2="392" stroke="#000000" stroke-width="1.5" marker-start="url(#compDiamond)" marker-end="url(#openArrow)"/>
  <text x="923" y="520" font-size="10">1 fileHandler</text>

  <!-- GymGUI uses DataManager -->
  <path d="M 1030 645 L 1030 430 L 1082 430 L 1082 110 L 1067 110" fill="none" stroke="#000000" stroke-width="1.4" marker-start="url(#compDiamond)" marker-end="url(#openArrow)"/>
  <text x="1038" y="422" font-size="10">3 repos</text>

  <!-- GymGUI catches Custom Exceptions -->
  <line x1="560" y1="735" x2="477" y2="735" stroke="#000000" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#openArrow)"/>
  <text x="488" y="728" font-size="10">&lt;&lt;handles&gt;&gt;</text>

  <!-- UML Legend -->
  <g transform="translate(25,834)">
    <rect width="1040" height="32" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="12" y="20" font-size="11" font-weight="bold">UML Legend:</text>

    <line x1="108" y1="16" x2="150" y2="16" stroke="#000000" stroke-width="1.5" marker-end="url(#hollowTri)"/>
    <text x="158" y="20" font-size="11">Inheritance</text>

    <line x1="252" y1="16" x2="294" y2="16" stroke="#000000" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#hollowTri)"/>
    <text x="302" y="20" font-size="11">Realization (implements)</text>

    <line x1="468" y1="16" x2="514" y2="16" stroke="#000000" stroke-width="1.5" marker-start="url(#compDiamond)" marker-end="url(#openArrow)"/>
    <text x="522" y="20" font-size="11">Composition (owns)</text>

    <line x1="658" y1="16" x2="704" y2="16" stroke="#000000" stroke-width="1.5" marker-start="url(#aggDiamond)" marker-end="url(#openArrow)"/>
    <text x="712" y="20" font-size="11">Aggregation (has-a)</text>

    <line x1="848" y1="16" x2="890" y2="16" stroke="#000000" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#openArrow)"/>
    <text x="898" y="20" font-size="11">Dependency / Handles</text>
  </g>
</svg>